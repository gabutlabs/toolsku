services:
  pdf-compressor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - pdf-compression-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdf-compression-logs:
